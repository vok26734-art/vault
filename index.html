<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Games | Pro Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">

    <header>
        <div class="top-bar">
            <div class="logo">⚡ Vault<span>Games</span></div>
            <div id="userSection" class="user-section"></div>
        </div>
        <nav>
            <div class="search-container">
                <input type="text" id="searchBar" placeholder="Search the Vault...">
            </div>
            <div class="categories">
                <button class="cat-btn active" onclick="filterCategory('all')">All</button>
                <button class="cat-btn" onclick="filterCategory('action')">Action</button>
                <button class="cat-btn" onclick="filterCategory('retro')">Retro</button>
            </div>
        </nav>
    </header>

    <div id="loginModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h2>Welcome, Player 1</h2>
            <p>Enter the Vault to start earning badges</p>
            <input type="text" id="usernameInput" placeholder="Enter Username">
            <button class="main-btn" onclick="saveProfile()">Begin Journey</button>
        </div>
    </div>

    <main id="mainContent">
        <section id="featuredSection" class="hero-section">
            <div class="hero-content">
                <span class="badge">TRENDING NOW</span>
                <h1 id="featuredTitle">Loading Vault...</h1>
                <button class="play-btn" id="featuredPlayBtn">Launch Game</button>
            </div>
        </section>

        <section id="gamePlayerContainer" style="display:none;">
            <div class="player-header">
                <button class="back-btn" onclick="closeGame()">← Quit Game</button>
                <button class="fs-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
            </div>
            <iframe id="gameFrame" src="" frameborder="0" allowfullscreen></iframe>
            <div class="score-panel">
                <input type="number" id="manualScore" placeholder="Enter New Score">
                <button onclick="submitScore()">Submit High Score</button>
            </div>
        </section>

        <section class="shelf" id="achievementShelf">
            <h2>Your Achievements</h2>
            <div id="badgeList" class="badge-container">
                </div>
        </section>

        <section class="shelf" id="recentGames">
            <h2>Continue Playing</h2>
            <div id="recentList" class="game-grid"></div>
        </section>

        <section class="shelf" id="gameLibrary">
            <h2>The Library</h2>
            <div id="gameGrid" class="game-grid"></div>
        </section>

        <section class="shelf" id="leaderboardSection">
            <h2>Trophy Room</h2>
            <div class="stats-container">
                <table id="leaderboardTable">
                    <thead>
                        <tr><th>Game</th><th>Personal Best</th></tr>
                    </thead>
                    <tbody id="leaderboardBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>

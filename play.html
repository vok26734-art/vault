<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Player</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #050505; color: white; display: flex; flex-direction: column; height: 100vh; margin: 0; overflow: hidden; }
        .player-header { padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid #333; }
        .game-area { flex-grow: 1; display: flex; justify-content: center; align-items: center; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
        .btn-back { padding: 8px 15px; background: var(--primary, #00ff88); color: black; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .game-title { font-family: sans-serif; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="player-header">
        <a href="index.html" class="btn-back">← EXIT GAME</a>
        <div class="game-title" id="game-title">Loading...</div>
        <div>
            <button onclick="toggleFullscreen()" style="background:none; border:1px solid #444; color:white; cursor:pointer; padding:5px 10px; border-radius:4px;">FULLSCREEN</button>
        </div>
    </div>

    <div class="game-area">
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const gameId = params.get("id");

        fetch("data/games.json")
            .then(res => res.json())
            .then(games => {
                const game = games.find(g => g.id === gameId);
                if (game) {
                    document.getElementById("game-title").innerText = game.title.toUpperCase();
                    document.getElementById("game-frame").src = game.url;
                    document.title = "Playing " + game.title;
                } else {
                    document.getElementById("game-title").innerText = "ERROR: GAME NOT FOUND";
                }
            });

        function toggleFullscreen() {
            const frame = document.getElementById("game-frame");
            if (frame.requestFullscreen) frame.requestFullscreen();
            else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
            else if (frame.msRequestFullscreen) frame.msRequestFullscreen();
        }
    </script>
</body>
</html>

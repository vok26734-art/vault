<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Games | v2.1 Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">

    <div id="loadingOverlay" class="loader-wrapper" style="display:none;">
        <div class="loader"></div>
        <p id="loaderText">Initializing Secure Connection...</p>
    </div>

    <header>
        <div class="top-bar">
            <div class="logo">⚡ Vault<span>Games</span></div>
            <div id="userSection" class="user-section">
                </div>
        </div>
        <nav class="sub-nav">
            <div class="search-box">
                <input type="text" id="searchBar" placeholder="Search the Vault...">
            </div>
            <div class="categories">
                <button class="cat-btn active" onclick="filterCategory('all')">All</button>
                <button class="cat-btn" onclick="filterCategory('action')">Action</button>
                <button class="cat-btn" onclick="filterCategory('retro')">Retro</button>
                <button class="cat-btn" onclick="filterCategory('favs')">❤️ Favorites</button>
            </div>
        </nav>
    </header>

    <div id="loginModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h2>System Encrypted</h2>
            <p>Define your operative identity</p>
            <input type="text" id="usernameInput" placeholder="Operative Name">
            <button class="play-btn" onclick="saveProfile()">Begin Mission</button>
        </div>
    </div>

    <main id="mainContent">
        <section id="featuredSection" class="hero-section">
            <div class="hero-content">
                <span class="badge">TOP PICK</span>
                <h1 id="featuredTitle">Vaulting...</h1>
                <button class="play-btn" id="featuredPlayBtn">Launch Game</button>
            </div>
        </section>

        <section id="gamePlayerContainer" style="display:none;">
            <div class="player-header">
                <button class="back-btn" onclick="closeGame()">← Abort Mission</button>
                <button class="fs-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
            </div>
            <div class="iframe-wrapper">
                <iframe id="gameFrame" src="" frameborder="0" allowfullscreen></iframe>
            </div>
            <div class="score-panel">
                <input type="number" id="manualScore" placeholder="Log High Score">
                <button onclick="submitScore()">Submit</button>
            </div>
        </section>

        <section class="shelf" id="achievementShelf">
            <h2>Trophies & Badges</h2>
            <div id="badgeList" class="badge-container"></div>
        </section>

        <section class="shelf" id="recentGames">
            <h2>Recently Played</h2>
            <div id="recentList" class="game-grid horizontal"></div>
        </section>

        <section class="shelf" id="gameLibrary">
            <h2>Available Missions</h2>
            <div id="gameGrid" class="game-grid"></div>
        </section>

        <section class="shelf" id="leaderboardSection">
            <h2>Hall of Fame</h2>
            <div class="stats-container">
                <table id="leaderboardTable">
                    <thead>
                        <tr><th>Mission</th><th>Record</th></tr>
                    </thead>
                    <tbody id="leaderboardBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="status-bar">
        <div class="status-item"><span class="dot"></span> <span id="systemStatus">System Online</span></div>
        <div class="status-item" id="currentTime">00:00:00</div>
        <div class="status-item">v2.1.0-PRO</div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
